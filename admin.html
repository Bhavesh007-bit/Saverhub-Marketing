<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saverhub Marketing Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#0f172a;color:#e2e8f0;min-height:100vh;}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px;}
h1{font-size:22px;margin-bottom:16px;color:#fff;}
h2{font-size:16px;margin:24px 0 10px;color:#93c5fd;}

/* login */
#login-box{max-width:340px;margin:80px auto;background:#1e293b;padding:28px;border-radius:14px;}
#login-box input{width:100%;padding:10px;margin-bottom:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;}
#login-box button{width:100%;padding:10px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-weight:700;cursor:pointer;}
#login-error{color:#f87171;font-size:13px;margin-bottom:10px;min-height:16px;}

/* stat cards */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.stat-card{flex:1;min-width:140px;background:#1e293b;padding:16px;border-radius:12px;}
.stat-card .num{font-size:26px;font-weight:800;color:#60a5fa;}
.stat-card .label{font-size:12px;color:#94a3b8;margin-top:4px;}

/* links table */
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden;}
th,td{padding:10px;text-align:left;font-size:13px;border-bottom:1px solid #334155;}
th{color:#94a3b8;font-weight:600;}
img.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;}
.actions button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin-right:6px;}
.btn-edit{background:#3b82f6;color:#fff;}
.btn-del{background:#ef4444;color:#fff;}
.btn-toggle{background:#334155;color:#fff;}

/* form */
#link-form{background:#1e293b;padding:18px;border-radius:12px;margin-top:14px;display:none;}
#link-form input, #link-form textarea{width:100%;padding:9px;margin-bottom:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:13px;}
#link-form label{font-size:12px;color:#94a3b8;display:block;margin-bottom:4px;}
#link-form button{padding:9px 16px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-right:8px;}
.btn-save{background:#22c55e;color:#052e16;}
.btn-cancel{background:#334155;color:#fff;}
.btn-add{background:#3b82f6;color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer;margin-bottom:6px;}

#logout{float:right;background:#334155;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;}
#app{display:none;}
.empty{color:#94a3b8;font-size:13px;padding:14px;text-align:center;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-box">
  <h1>Saverhub Marketing Admin</h1>
  <div id="login-error"></div>
  <input type="email" id="email" placeholder="Admin email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app">
<div class="wrap">
  <button id="logout" onclick="logout()">Logout</button>
  <h1>Saverhub Marketing Admin Panel</h1>

  <div class="stats">
    <div class="stat-card"><div class="num" id="stat-visits">–</div><div class="label">Total Visits</div></div>
    <div class="stat-card"><div class="num" id="stat-clicks">–</div><div class="label">Total Link Clicks</div></div>
    <div class="stat-card"><div class="num" id="stat-links">–</div><div class="label">Active Links</div></div>
  </div>

  <h2>Site Settings</h2>
  <div id="settings-box" style="background:#1e293b;padding:18px;border-radius:12px;margin-bottom:20px;">
    <label style="font-size:12px;color:#94a3b8;display:block;margin-bottom:4px;">Logo Image URL</label>
    <input id="s-logo-url" placeholder="https://... (link to your logo image)" style="width:100%;padding:9px;margin-bottom:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:13px;">

    <label style="font-size:12px;color:#94a3b8;display:block;margin-bottom:4px;">Logo Shape</label>
    <select id="s-logo-shape" style="width:100%;padding:9px;margin-bottom:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:13px;">
      <option value="circle">Circle (round)</option>
      <option value="rounded">Rounded square</option>
      <option value="square">Square (sharp corners)</option>
    </select>

    <button onclick="saveSettings()" style="padding:9px 16px;border:none;border-radius:8px;font-weight:700;cursor:pointer;background:#22c55e;color:#052e16;">Save Settings</button>
    <span id="settings-status" style="font-size:12px;color:#94a3b8;margin-left:10px;"></span>
  </div>

  <h2>Links</h2>
  <button class="btn-add" onclick="showForm()">+ Add New Link</button>

  <div id="link-form">
    <input type="hidden" id="edit-id">
    <label>Title</label>
    <input id="f-title" placeholder="e.g. SB Loots And Deals">
    <label>Description</label>
    <textarea id="f-desc" rows="2" placeholder="Short description shown under the title"></textarea>
    <label>Link URL</label>
    <input id="f-url" placeholder="https://...">
    <label>Custom Icon URL (optional — link ke domain se auto-detect ho jayega, e.g. Telegram/WhatsApp/Amazon logo)</label>
    <input id="f-image" placeholder="Leave blank for auto-detected icon">
    <label>Order (smaller number shows first)</label>
    <input id="f-order" type="number" value="1">
    <label><input type="checkbox" id="f-active" checked style="width:auto;display:inline-block;margin-right:6px;"> Active (visible on site)</label>
    <div>
      <button class="btn-save" onclick="saveLink()">Save</button>
      <button class="btn-cancel" onclick="hideForm()">Cancel</button>
    </div>
  </div>

  <table id="links-table" style="margin-top:14px;">
    <thead>
      <tr><th>Icon</th><th>Title</th><th>Order</th><th>Clicks</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody id="links-tbody"></tbody>
  </table>

</div>
</div>

<script>
// ===== PASTE YOUR FIREBASE CONFIG HERE (same as index.html) =====
const firebaseConfig = {
  apiKey: "AIzaSyCoLclYwHuAH4l6PdD_l1Dr7enwXV78uoI",
  authDomain: "saverhub-linktree.firebaseapp.com",
  projectId: "saverhub-linktree",
  storageBucket: "saverhub-linktree.firebasestorage.app",
  messagingSenderId: "572192936201",
  appId: "1:572192936201:web:1a44cc62a74325b65dc3d8",
  measurementId: "G-LNXRH2BTSE"
};
// ===================================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Auto-detect a brand icon from the link's domain (Telegram, WhatsApp, Amazon, etc.)
function detectIcon(url) {
  try {
    const host = new URL(url).hostname.replace('www.', '').toLowerCase();
    const map = {
      't.me': 'telegram', 'telegram.me': 'telegram', 'telegram.org': 'telegram',
      'wa.me': 'whatsapp', 'whatsapp.com': 'whatsapp', 'chat.whatsapp.com': 'whatsapp',
      'instagram.com': 'instagram',
      'facebook.com': 'facebook', 'fb.com': 'facebook', 'fb.me': 'facebook',
      'youtube.com': 'youtube', 'youtu.be': 'youtube',
      'twitter.com': 'x', 'x.com': 'x',
      'amazon.in': 'amazon', 'amazon.com': 'amazon',
      'flipkart.com': 'flipkart',
      'myntra.com': 'myntra',
      'ajio.com': 'ajio',
      'meesho.com': 'meesho',
      'shopsy.in': 'shopsy',
      'snapchat.com': 'snapchat',
      'pinterest.com': 'pinterest',
      'linkedin.com': 'linkedin',
      'discord.com': 'discord', 'discord.gg': 'discord',
      'paytm.com': 'paytm',
      'phonepe.com': 'phonepe'
    };
    const slug = map[host];
    if (slug) return `https://cdn.simpleicons.org/${slug}`;
    // fallback: try to fetch the site's own favicon
    return `https://www.google.com/s2/favicons?sz=128&domain=${host}`;
  } catch (e) {
    return '';
  }
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadDashboard();
    loadSettings();
  } else {
    document.getElementById('login-box').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  document.getElementById('login-error').textContent = '';
  auth.signInWithEmailAndPassword(email, password)
    .catch(err => { document.getElementById('login-error').textContent = err.message; });
}

function logout() { auth.signOut(); }

function loadSettings() {
  db.collection('settings').doc('site').get().then(doc => {
    if (doc.exists) {
      const s = doc.data();
      document.getElementById('s-logo-url').value = s.logoUrl || '';
      document.getElementById('s-logo-shape').value = s.logoShape || 'circle';
    }
  });
}

function saveSettings() {
  const data = {
    logoUrl: document.getElementById('s-logo-url').value.trim(),
    logoShape: document.getElementById('s-logo-shape').value
  };
  const statusEl = document.getElementById('settings-status');
  statusEl.textContent = 'Saving...';
  db.collection('settings').doc('site').set(data, { merge: true })
    .then(() => { statusEl.textContent = 'Saved ✓'; setTimeout(() => statusEl.textContent = '', 2000); })
    .catch(err => { statusEl.textContent = 'Error: ' + err.message; });
}

function loadDashboard() {
  // visits count
  db.collection('visits').get().then(snap => {
    document.getElementById('stat-visits').textContent = snap.size;
  });

  // links + clicks
  db.collection('links').orderBy('order', 'asc').get().then(snap => {
    let totalClicks = 0;
    let activeCount = 0;
    const tbody = document.getElementById('links-tbody');
    tbody.innerHTML = '';

    if (snap.empty) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No links yet. Click "Add New Link".</td></tr>';
    }

    snap.forEach(doc => {
      const d = doc.data();
      const clicks = d.clicks || 0;
      totalClicks += clicks;
      if (d.active) activeCount++;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><img class="thumb" src="${d.image || detectIcon(d.url)}" onerror="this.style.visibility='hidden'"></td>
        <td>${d.title || ''}</td>
        <td>${d.order ?? ''}</td>
        <td>${clicks}</td>
        <td>${d.active ? '✅ Active' : '⛔ Hidden'}</td>
        <td class="actions">
          <button class="btn-edit" onclick='editLink("${doc.id}")'>Edit</button>
          <button class="btn-toggle" onclick='toggleLink("${doc.id}", ${!!d.active})'>${d.active ? 'Hide' : 'Show'}</button>
          <button class="btn-del" onclick='deleteLink("${doc.id}")'>Delete</button>
        </td>
      `;
      tbody.appendChild(tr);

      // stash data for edit
      tr.dataset.link = JSON.stringify(d);
      window['__link_' + doc.id] = d;
    });

    document.getElementById('stat-clicks').textContent = totalClicks;
    document.getElementById('stat-links').textContent = activeCount;
  });
}

function showForm() {
  document.getElementById('edit-id').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-url').value = '';
  document.getElementById('f-image').value = '';
  document.getElementById('f-order').value = 1;
  document.getElementById('f-active').checked = true;
  document.getElementById('link-form').style.display = 'block';
}

function hideForm() {
  document.getElementById('link-form').style.display = 'none';
}

function editLink(id) {
  const d = window['__link_' + id];
  document.getElementById('edit-id').value = id;
  document.getElementById('f-title').value = d.title || '';
  document.getElementById('f-desc').value = d.desc || '';
  document.getElementById('f-url').value = d.url || '';
  document.getElementById('f-image').value = d.image || '';
  document.getElementById('f-order').value = d.order || 1;
  document.getElementById('f-active').checked = !!d.active;
  document.getElementById('link-form').style.display = 'block';
  window.scrollTo(0, document.getElementById('link-form').offsetTop - 20);
}

function saveLink() {
  const id = document.getElementById('edit-id').value;
  const data = {
    title: document.getElementById('f-title').value.trim(),
    desc: document.getElementById('f-desc').value.trim(),
    url: document.getElementById('f-url').value.trim(),
    image: document.getElementById('f-image').value.trim(),
    order: Number(document.getElementById('f-order').value) || 1,
    active: document.getElementById('f-active').checked
  };
  if (!data.title || !data.url) {
    alert('Title aur Link URL dono zaruri hain.');
    return;
  }

  const ref = id ? db.collection('links').doc(id) : db.collection('links').doc();
  if (!id) data.clicks = 0;

  ref.set(data, { merge: true }).then(() => {
    hideForm();
    loadDashboard();
  }).catch(err => alert('Error: ' + err.message));
}

function toggleLink(id, current) {
  db.collection('links').doc(id).update({ active: !current }).then(loadDashboard);
}

function deleteLink(id) {
  if (!confirm('Ye link permanently delete ho jayega. Confirm?')) return;
  db.collection('links').doc(id).delete().then(loadDashboard);
}
</script>

</body>
</html>
