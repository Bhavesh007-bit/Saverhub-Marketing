<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saverhub Marketing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Google Analytics (optional, can keep as backup) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YCZ09F3TWF"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-YCZ09F3TWF');
</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#7fd5ff,#c7f0ff);
min-height:100vh;
padding:20px;
overflow-y:auto;
}

.container{
width:100%;
max-width:420px;
margin:auto;
text-align:center;
padding-bottom:30px;
}

.profile{
margin-bottom:18px;
}

.mainlogo{
width:190px;
height:190px;
object-fit:cover;
border-radius:50%;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
margin-bottom:15px;
}

.title{
font-size:34px;
font-weight:800;
color:#062f4f;
letter-spacing:1px;
}

.bio{
margin-top:12px;
font-size:17px;
font-weight:700;
color:#083b66;
line-height:1.7;
background:rgba(255,255,255,0.6);
padding:12px;
border-radius:14px;
box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.link-card{
position:relative;
overflow:hidden;
display:flex;
align-items:center;
gap:14px;
background:rgba(255,255,255,0.7);
backdrop-filter:blur(12px);
padding:16px;
border-radius:20px;
margin:14px 0;
text-decoration:none;
color:#083b66;
font-weight:600;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
transition:all .35s ease;
}

.link-card:hover{
transform:translateY(-4px) scale(1.02);
box-shadow:0 12px 28px rgba(0,0,0,0.22);
}

.link-card img{
width:62px;
height:62px;
border-radius:14px;
object-fit:cover;
}

.link-text{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.link-title{
font-size:18px;
font-weight:700;
color:#0b4a7a;
}

.link-desc{
font-size:13px;
color:#4b6b85;
margin-top:4px;
font-weight:600;
line-height:1.5;
}

.footer{
margin-top:25px;
font-size:12px;
color:#1b4f72;
}

.loading{
color:#083b66;
font-weight:600;
padding:20px;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGO -->

<div class="profile">
<img src="logo.png" class="mainlogo">
</div>

<h1 class="title">Saverhub Marketing</h1>

<p class="bio">
Join Best Free & Fastest All Online <br>
E-Commerce Deals & Offers Broadcast <br>
Service & Enjoy Saving ♥️
</p>

<div id="links-container">
<div class="loading">Loading links...</div>
</div>

<div class="footer">
© 2026 Saverhub • All Rights Reserved
</div>

</div>

<script>
// ===== PASTE YOUR FIREBASE CONFIG HERE (same as admin.html) =====
const firebaseConfig = {
  apiKey: "AIzaSyCoLclYwHuAH4l6PdD_l1Dr7enwXV78uoI",
  authDomain: "saverhub-linktree.firebaseapp.com",
  projectId: "saverhub-linktree",
  storageBucket: "saverhub-linktree.firebasestorage.app",
  messagingSenderId: "572192936201",
  appId: "1:572192936201:web:1a44cc62a74325b65dc3d8",
  measurementId: "G-LNXRH2BTSE"
};
// ===================================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Auto-detect a brand icon from the link's domain (Telegram, WhatsApp, Amazon, etc.)
function detectIcon(url) {
  try {
    const host = new URL(url).hostname.replace('www.', '').toLowerCase();
    const map = {
      't.me': 'telegram', 'telegram.me': 'telegram', 'telegram.org': 'telegram',
      'wa.me': 'whatsapp', 'whatsapp.com': 'whatsapp', 'chat.whatsapp.com': 'whatsapp',
      'instagram.com': 'instagram',
      'facebook.com': 'facebook', 'fb.com': 'facebook', 'fb.me': 'facebook',
      'youtube.com': 'youtube', 'youtu.be': 'youtube',
      'twitter.com': 'x', 'x.com': 'x',
      'amazon.in': 'amazon', 'amazon.com': 'amazon',
      'flipkart.com': 'flipkart',
      'myntra.com': 'myntra',
      'ajio.com': 'ajio',
      'meesho.com': 'meesho',
      'shopsy.in': 'shopsy',
      'snapchat.com': 'snapchat',
      'pinterest.com': 'pinterest',
      'linkedin.com': 'linkedin',
      'discord.com': 'discord', 'discord.gg': 'discord',
      'paytm.com': 'paytm',
      'phonepe.com': 'phonepe'
    };
    const slug = map[host];
    if (slug) return `https://cdn.simpleicons.org/${slug}`;
    return `https://www.google.com/s2/favicons?sz=128&domain=${host}`;
  } catch (e) {
    return '';
  }
}

// Log a visit (page view)
db.collection('visits').add({
  timestamp: firebase.firestore.FieldValue.serverTimestamp(),
  userAgent: navigator.userAgent,
  referrer: document.referrer || 'direct'
}).catch(err => console.error('visit log failed', err));

// Load active links, ordered
const container = document.getElementById('links-container');

db.collection('links')
  .where('active', '==', true)
  .orderBy('order', 'asc')
  .get()
  .then(snapshot => {
    container.innerHTML = '';
    if (snapshot.empty) {
      container.innerHTML = '<div class="loading">No links yet.</div>';
      return;
    }
    snapshot.forEach(doc => {
      const link = doc.data();
      const id = doc.id;

      const a = document.createElement('a');
      a.className = 'link-card';
      a.href = link.url;

      a.innerHTML = `
        <img src="${link.image || detectIcon(link.url)}" onerror="this.style.display='none'">
        <div class="link-text">
          <div class="link-title">${link.title || ''}</div>
          <div class="link-desc">${link.desc || ''}</div>
        </div>
      `;

      a.addEventListener('click', function(e) {
        e.preventDefault();
        // fire GA event too (optional)
        if (typeof gtag === 'function') {
          gtag('event', 'click', { event_label: link.title });
        }
        db.collection('links').doc(id).update({
          clicks: firebase.firestore.FieldValue.increment(1)
        }).finally(() => {
          window.location.href = link.url;
        });
        // safety fallback in case Firestore is slow/offline
        setTimeout(() => { window.location.href = link.url; }, 600);
      });

      container.appendChild(a);
    });
  })
  .catch(err => {
    console.error(err);
    container.innerHTML = '<div class="loading">Could not load links. Please refresh.</div>';
  });
</script>

</body>
</html>
